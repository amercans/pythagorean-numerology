name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests with coverage
        run: npm test -- --coverage
      - name: Build
        run: npm run build
      - name: Load the ESM and CommonJS builds
        run: |
          node --input-type=module -e 'import { lifePath } from "./dist/index.js"; if (lifePath(1988, 11, 3).number !== 22) process.exit(1)'
          node -e 'const { lifePath } = require("./dist/index.cjs"); if (lifePath(1988, 11, 3).number !== 22) process.exit(1)'
